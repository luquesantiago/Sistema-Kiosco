# Base de datos para desarrollo y tests, y WhatsApp (WAHA) aparte con el perfil
# `whatsapp` (pnpm whatsapp:up). Solo escuchan en la máquina local.
name: kiosco-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kiosco
      POSTGRES_PASSWORD: kiosco
      POSTGRES_DB: kiosco
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiosco -d kiosco']
      interval: 2s
      timeout: 3s
      retries: 15

  waha:
    image: devlikeapro/waha:gows-2026.9.2
    profiles: [whatsapp]
    environment:
      TZ: America/Argentina/Buenos_Aires
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: kiosco-dev
      # Panel de WAHA para depurar: http://localhost:3200/dashboard (admin / kiosco-dev).
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: kiosco-dev
    ports:
      # El 3000 lo usa la API y el 3100 el e2e.
      - '127.0.0.1:${WAHA_PORT:-3200}:3000'
    volumes:
      - waha-sesiones:/app/.sessions

volumes:
  db-data:
  waha-sesiones:
