name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kiosco
          POSTGRES_PASSWORD: kiosco
          POSTGRES_DB: kiosco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiosco -d kiosco_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://kiosco:kiosco@localhost:5432/kiosco_test
    steps:
      - uses: actions/checkout@v5
      # Instala la versión de pnpm fijada en `packageManager`; setup-node la necesita para la caché.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kiosco
          POSTGRES_PASSWORD: kiosco
          POSTGRES_DB: kiosco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiosco -d kiosco_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://kiosco:kiosco@localhost:5432/kiosco_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Compila web y API, levanta la API en modo producción y corre el flujo del mostrador.
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-resultados
          path: apps/web/test-results/
          retention-days: 7
