name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kiosco
          POSTGRES_PASSWORD: kiosco
          POSTGRES_DB: kiosco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiosco -d kiosco_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://kiosco:kiosco@localhost:5432/kiosco_test
    steps:
      - uses: actions/checkout@v5
      # Instala la versión de pnpm fijada en `packageManager`; setup-node la necesita para la caché.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kiosco
          POSTGRES_PASSWORD: kiosco
          POSTGRES_DB: kiosco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiosco -d kiosco_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://kiosco:kiosco@localhost:5432/kiosco_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Compila web y API, levanta la API en modo producción y corre el flujo del mostrador.
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-resultados
          path: apps/web/test-results/
          retention-days: 7

  produccion:
    # Construye la imagen y levanta el Compose de producción como en el servidor,
    # con DOMINIO=localhost (Caddy usa su propia autoridad de certificación).
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f infra/docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v5
      - name: Configuración de prueba
        run: printf 'DOMINIO=localhost\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > infra/.env
      - run: $COMPOSE build app migrate
      - run: $COMPOSE run --rm migrate
      - run: $COMPOSE up -d --wait
      - name: HTTPS, redirección y puertos cerrados
        run: |
          # Caddy no tiene healthcheck: puede tardar un momento en emitir el certificado.
          curl -fsSk --retry 10 --retry-all-errors --retry-delay 1 https://localhost/api/health | grep -q '"estado":"ok"'
          test "$(curl -s --retry 10 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost/venta)" = "308 https://localhost/venta"
          for servicio in db app; do
            test "$(docker inspect -f '{{json .HostConfig.PortBindings}}' "kiosco-$servicio-1")" = '{}'
          done
      - if: failure()
        run: $COMPOSE logs
